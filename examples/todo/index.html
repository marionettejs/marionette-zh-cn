<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marionette todo exercise — reference fixture</title>
    <style>
      body { font: 18px/1.5 system-ui, sans-serif; max-width: 38rem; margin: 3rem auto; padding: 0 1rem; color: #20252b; }
      input, button { font: inherit; }
      form { display: flex; flex-wrap: wrap; gap: .5rem; }
      input[type=text] { max-width: 100%; box-sizing: border-box; }
      nav { display: flex; gap: .5rem; }
      button[aria-pressed=true] { font-weight: bold; outline: 2px solid #2963ad; }
      li { margin: .6rem 0; overflow-wrap: anywhere; }
      li:has(input:checked) span { text-decoration: line-through; }
      small { color: #505863; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
